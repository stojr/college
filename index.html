<style>
:root{--paper:#ECF0EF;--card:#F8FAF9;--ink:#0C1A1D;--ink-2:#36474B;--muted:#5F7074;--rule:#C6D0CF;--accent:#1546C8;--accent-ink:#FFFFFF;--bad:#B3261E;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#0A1316;--card:#101C20;--ink:#E4ECEE;--ink-2:#B3C2C6;--muted:#8A9CA1;--rule:#24363C;--accent:#7499FF;--accent-ink:#06122E;--bad:#FF8A80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.45;display:flex;align-items:center;justify-content:center;padding:24px 16px}
main{width:100%;max-width:380px;background:var(--card);border:1px solid var(--rule);border-top:6px solid var(--accent);border-radius:6px;padding:24px 22px 20px}
.tile{display:inline-flex;flex-direction:column;justify-content:space-between;width:58px;height:58px;border:2px solid var(--ink);padding:4px 6px;font-family:ui-monospace,Consolas,monospace}
.tile small{font-size:10px;line-height:1}.tile b{font-size:24px;line-height:1;font-family:"Arial Narrow",system-ui,sans-serif}
h1{font-family:"Arial Narrow","Roboto Condensed",system-ui,sans-serif;font-weight:800;font-size:40px;line-height:1;letter-spacing:.02em;text-transform:uppercase;margin:14px 0 6px}
p{margin:0 0 16px;color:var(--ink-2)}
label{display:block;font-family:ui-monospace,Consolas,monospace;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input{width:100%;font:inherit;font-size:19px;padding:10px 12px;background:var(--paper);color:var(--ink);border:2px solid var(--rule);border-radius:4px}
input:focus{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
button{margin-top:12px;width:100%;appearance:none;border:0;border-radius:4px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;font-size:18px;padding:11px 14px;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
#msg{min-height:1.4em;margin:10px 0 0;color:var(--bad);font-size:15px}
.s{margin:10px 0 0;font-size:14px;color:var(--muted)}
</style></head><body>

    <p id="msg" role="alert"></p>
  </form>
  <p class="s">This device remembers you after the first time.</p>
</main>
